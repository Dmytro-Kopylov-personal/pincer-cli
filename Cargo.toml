[package]
name = "pincer-cli"
version = "0.1.0"
edition = "2021"
description = "A minimal terminal client for lobste.rs"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
termimad = "0.30"
anyhow = "1"
