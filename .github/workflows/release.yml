name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Verify tagged commit is on main branch
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build release binary
        run: cargo build --release
      - name: Package artifact
        run: |
          mkdir -p dist
          cp target/release/pincer-cli dist/pincer-cli-linux-x86_64
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-path: dist/pincer-cli-linux-x86_64
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@e8998f949152b193b063cb0ec769d69d929409be
        with:
          files: dist/*
